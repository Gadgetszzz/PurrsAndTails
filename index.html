<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Purrs And Tails — Shop My Faves</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Figtree:wght@400;600;700;800&display=swap');

  :root{
    --cream:#FFFBF2;
    --ink:#292118;
    --coral:#FF6F59;
    --coral-dark:#E8543D;
    --marigold:#FFB020;
    --marigold-soft:#FFE3AD;
    --berry:#F0508B;
    --berry-soft:#FBD7E5;
    --grass:#4CAF7D;
    --grass-soft:#D7F0E3;
    --sky:#4FB6E8;
    --sky-soft:#DBF0FA;
    --coral-soft:#FFD9CE;
    --graphite:#5B6B73;
    --graphite-soft:#E4EAEC;
    --shadow: 0 10px 24px -12px rgba(240,80,139,0.3);
    --radius-lg: 28px;
    --radius-md: 20px;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}

  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }

  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:'Figtree', sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:40px;
  }

  a{color:inherit;}

  /* ---------- Header ---------- */
  header{
    position:sticky;
    top:0;
    z-index:40;
    background:rgba(255,248,236,0.92);
    backdrop-filter: blur(8px);
    border-bottom:2px solid rgba(43,33,24,0.06);
    transition: transform 0.35s ease;
  }
  header.header--hidden{
    transform: translateY(-100%);
  }
  .header-inner{
    max-width:720px;
    margin:0 auto;
    padding:14px 20px;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .logo-badge{
    width:44px;height:44px;
    border-radius:50%;
    background:var(--coral);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    box-shadow: 0 6px 14px -6px rgba(232,84,61,0.5);
  }
  .logo-badge svg{width:24px;height:24px;}
  .brand-text{display:flex;flex-direction:column;line-height:1.1;}
  .brand-name{
    font-family:'Fredoka',sans-serif;
    font-weight:700;
    font-size:20px;
  }
  .brand-tag{
    font-size:13px;
    color:rgba(43,33,24,0.6);
    font-weight:600;
  }

  /* ---------- Hero ---------- */
  .hero{
    max-width:720px;
    margin:0 auto;
    padding:36px 20px 20px;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  .paw-drift{
    position:absolute;
    font-size:28px;
    opacity:0;
    animation: driftUp 2.6s ease-out forwards;
    pointer-events:none;
  }
  @keyframes driftUp{
    0%{opacity:0; transform:translateY(30px) rotate(-8deg);}
    15%{opacity:0.5;}
    100%{opacity:0; transform:translateY(-160px) rotate(12deg);}
  }
  .hero h1{
    font-family:'Fredoka',sans-serif;
    font-weight:700;
    font-size:clamp(28px, 6vw, 38px);
    line-height:1.15;
    margin:6px 0 10px;
  }
  .hero p{
    font-size:16px;
    color:rgba(43,33,24,0.72);
    max-width:420px;
    margin:0 auto;
    line-height:1.5;
    font-weight:600;
  }
  .hero-pill{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--marigold-soft);
    padding:6px 16px;
    border-radius:999px;
    font-weight:800;
    font-size:13px;
    margin-bottom:14px;
  }

  /* ---------- Product grid ---------- */
  .grid{
    max-width:720px;
    margin:24px auto 0;
    padding:0 16px;
    display:grid;
    grid-template-columns:1fr;
    gap:16px;
  }
  @media (min-width:560px){
    .grid{grid-template-columns:1fr 1fr;}
  }

  .card{
    border-radius:var(--radius-lg);
    padding:18px;
    cursor:pointer;
    border:none;
    text-align:left;
    font:inherit;
    color:inherit;
    display:flex;
    flex-direction:column;
    gap:10px;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
    box-shadow: 0 8px 18px -12px rgba(43,33,24,0.25);
  }
  .card:hover, .card:focus-visible{
    transform:translateY(-4px);
    box-shadow: var(--shadow);
  }
  .card:focus-visible{
    outline:3px solid var(--coral-dark);
    outline-offset:2px;
  }
  .card-icon-wrap{
    width:100%;
    aspect-ratio:1.3/1;
    border-radius:var(--radius-md);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .card-icon-wrap svg{width:56%; height:56%;}
  .card h3{
    font-family:'Fredoka',sans-serif;
    font-size:18px;
    margin:0;
    line-height:1.25;
  }
  .card .blurb{
    font-size:13.5px;
    color:rgba(43,33,24,0.68);
    line-height:1.4;
    margin:0;
    font-weight:600;
  }
  .card .tap-hint{
    font-size:12.5px;
    font-weight:800;
    color:var(--coral-dark);
    display:flex;
    align-items:center;
    gap:4px;
    margin-top:2px;
  }

  /* ---------- Footer note ---------- */
  .footer-note{
    max-width:720px;
    margin:30px auto 0;
    padding:0 24px;
    text-align:center;
    font-size:12.5px;
    color:rgba(43,33,24,0.5);
    font-weight:600;
    line-height:1.5;
  }

  /* ---------- Detail sheet ---------- */
  .overlay{
    position:fixed;
    inset:0;

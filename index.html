<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Purrs and Tails — Shop My Faves</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Figtree:wght@400;600;700;800&display=swap');

  :root{
    --cream:#FFFBF2;
    --ink:#292118;
    --coral:#FF6F59;
    --coral-dark:#E8543D;
    --marigold:#FFB020;
    --marigold-soft:#FFE3AD;
    --berry:#F0508B;
    --berry-soft:#FBD7E5;
    --grass:#4CAF7D;
    --grass-soft:#D7F0E3;
    --sky:#4FB6E8;
    --sky-soft:#DBF0FA;
    --coral-soft:#FFD9CE;
    --graphite:#5B6B73;
    --graphite-soft:#E4EAEC;
    --shadow: 0 10px 24px -12px rgba(240,80,139,0.3);
    --radius-lg: 28px;
    --radius-md: 20px;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}

  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }

  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:'Figtree', sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:40px;
  }

  a{color:inherit;}

  header{
    position:sticky;
    top:0;
    z-index:40;
    background:rgba(255,248,236,0.92);
    backdrop-filter: blur(8px);
    border-bottom:2px solid rgba(43,33,24,0.06);
  }
  .header-inner{
    max-width:720px;
    margin:0 auto;
    padding:14px 20px;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .logo-badge{
    width:44px;height:44px;
    border-radius:50%;
    background:var(--coral);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    box-shadow: 0 6px 14px -6px rgba(232,84,61,0.5);
  }
  .logo-badge svg{width:24px;height:24px;}
  .brand-text{display:flex;flex-direction:column;line-height:1.1;}
  .brand-name{
    font-family:'Fredoka',sans-serif;
    font-weight:700;
    font-size:20px;
  }
  .brand-tag{
    font-size:13px;
    color:rgba(43,33,24,0.6);
    font-weight:600;
  }

  .hero{
    max-width:720px;
    margin:0 auto;
    padding:36px 20px 20px;
    text-align:center;
  }
  .hero h1{
    font-family:'Fredoka',sans-serif;
    font-weight:700;
    font-size:clamp(28px, 6vw, 38px);
    line-height:1.15;
    margin:6px 0 10px;
  }
  .hero p{
    font-size:16px;
    color:rgba(43,33,24,0.72);
    max-width:420px;
    margin:0 auto;
    line-height:1.5;
    font-weight:600;
  }
  .hero-pill{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--marigold-soft);
    padding:6px 16px;
    border-radius:999px;
    font-weight:800;
    font-size:13px;
    margin-bottom:14px;
  }

  .grid{
    max-width:720px;
    margin:24px auto 0;
    padding:0 16px;
    display:grid;
    grid-template-columns:1fr;
    gap:16px;
  }
  @media (min-width:560px){
    .grid{grid-template-columns:1fr 1fr;}
  }

  .card{
    background: white;
    border-radius:var(--radius-lg);
    padding:18px;
    cursor:pointer;
    border:none;
    text-align:left;
    font:inherit;
    color:inherit;
    display:flex;
    flex-direction:column;
    gap:10px;
    box-shadow: 0 8px 18px -12px rgba(43,33,24,0.25);
  }
  .card h3{
    font-family:'Fredoka',sans-serif;
    font-size:18px;
    margin:0;
  }
  .card .blurb{
    font-size:13.5px;
    color:rgba(43,33,24,0.68);
    margin:0;
    font-weight:600;
  }

  .footer-note{
    max-width:720px;
    margin:30px auto 0;
    padding:0 24px;
    text-align:center;
    font-size:12.5px;
    color:rgba(43,33,24,0.5);
    font-weight:600;
  }
</style>
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="logo-badge">
        <svg viewBox="0 0 24 24" fill="white"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
      </div>
      <div class="brand-text">
        <span class="brand-name">Purrs and Tails</span>
        <span class="brand-tag">Shop My Faves</span>
      </div>
    </div>
  </header>

  <main class="hero">
    <div class="hero-pill">🐾 Welcome to our store!</div>
    <h1>Everything your pets love</h1>
    <p>Discover our favorite picks for happy cats and dogs.</p>
  </main>

  <div class="grid">
    <div class="card">
      <h3>Happy Paws Toy</h3>
      <p class="blurb">Keep your pets entertained for hours.</p>
    </div>
    <div class="card">
      <h3>Cozy Bed</h3>
      <p class="blurb">Ultimate comfort for afternoon naps.</p>
    </div>
  </div>

  <div class="footer-note">
    <p>© 2026 Purrs and Tails. All rights reserved.</p>
  </div>

</body>
</html>
